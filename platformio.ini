; M5Stack Core2 for AWS IoT Kit project template PlatformIO configuration file
[platformio]
src_dir = main

[env:core2foraws]
platform = espressif32@7.1.3
framework = espidf
board = m5stack-core2
; Must match CONFIG_ESP_CONSOLE_UART_BAUDRATE; ROM boot messages stay at 115200
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
upload_speed = 1500000
; Board JSON defaults to 40 MHz; match CONFIG_ESPTOOLPY_FLASHFREQ_80M
board_build.f_flash = 80000000L

; If PlatformIO does not auto-detect the port the device is virtually mounted to, 
; uncomment the line below to set the upload_port (remove the ";") and paste the
; copied port you identified from PIO Quick Access menu --> PIO Home --> Devices 
; after the equal sign. You do not need to add quotes 
;(e.g. upload_port = /dev/cu.SLAB_USBtoUART).
;
; upload_port = 


; Custom partition file
board_build.partitions = partitions_16MB.csv

; Files to include in upload to non-volatile storage (flash)
board_build.embed_txtfiles = 

; ---------------------------------------------------------------------------
; On-device unit testing (Unity). Runs the suites under test/ on the hardware:
;   pio test -e core2foraws
; test_build_src = no keeps the normal app (main/) out of the test firmware so
; the test runner supplies its own app_main().
; ---------------------------------------------------------------------------
test_framework = unity
test_build_src = no
; Defaults to 115200, not monitor_speed
test_speed = 921600

; Please visit documentation for the other PlatformIO
; configuration options and examples
; http://docs.platformio.org/page/projectconf.html